    gold: [gotracs2024:chii:part1:sec5:s5.1]
    must_contain: ['prior to|before']
    kind: factual
  - id: n024
    question: Which covered persons supervised by the Insurance Commission are listed in the current reporting guidelines?
    gold: [gotracs2024:chi:sec3:s3.1:sb]
    must_contain: ['pre-need', 'reinsur', 'mutual benefit']
