  - id: n016
    question: Who reports covered transactions that come in through insurance brokers and agents?
    gold: [gotracs2024:chi:sec7:s7.5:sg]
    must_contain: ['insurance company|principal']
    kind: factual
  - id: n017
    question: How do the current reporting guidelines define "suspicion"?
    gold: [gotracs2024:chi:sec2:su, irr2018:rule2:sec1]
    must_contain: ['state of mind']
    kind: factual
  - id: n018
    question: Under GoTRACS, when is beneficial ownership direct and when is it indirect?
    gold: [gotracs2024:chi:sec2:se]
    must_contain: ['20|twenty', 'tiers|indirect']
