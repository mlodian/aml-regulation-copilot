    must_contain: ['11:59']
    kind: numeric
  - id: n007
    question: When does an STR submission count as non-compliant under GoTRACS?
    gold: [gotracs2024:chi:sec5:s5.4:sd]
    must_contain: ['11:59', 'next working day']
    kind: factual
  - id: n008
    question: Which transactions must casinos report as covered transactions?
