    gold: [gotracs2024:chi:sec4:s4.6]
    must_contain: ['coins|fiat']
    kind: factual
  - id: n010
    question: Can the AMLC require covered persons to report covered transactions that are normally deferred as low-risk?
    gold: [gotracs2024:chi:sec4:s4.7]
    must_contain: ['Executive Director']
