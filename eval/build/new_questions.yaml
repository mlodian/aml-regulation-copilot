# Phase 2 golden questions (drafted 2026-10-24; reviewed by a second annotator on a sample).
# Same fields as eval/golden.yaml, plus:
#   as_of: the date the question is asked about (default: the golden set's as_of)
#   pair:  links the two questions of a same-question, two-date pair
#   also:  sector restatements that state the same fact (see eval/build/relabel_pilot.py)
# Gold labels are section-id prefixes: "bo2018:sec4" matches every chunk of Section 4.

questions:
  # --- GoTRACS: current reporting rules ------------------------------------------
  - id: n001
    question: What report type and filing deadline apply to an STR about a high-priority predicate crime such as terrorism financing?
    gold: [gotracs2024:chi:sec5:s5.4:sc:s3:sv]
    must_contain: ['STRHP', 'next working day']
    kind: factual
  - id: n002
    question: Which report type do we use for highly unusual or suspicious transactions, and how fast must it be filed?
    gold: [gotracs2024:chi:sec5:s5.4:sc:s3:svi]
    must_contain: ['STRHU', 'next working day']
    kind: factual
  - id: n003
    question: After freezing an account on a target match under targeted financial sanctions, when must the STR be filed?
    gold: [gotracs2024:chi:sec5:s5.4:sc:s3:svii]
    must_contain: ['same day']
    kind: numeric
  - id: n004
    question: If the AMLC has not confirmed a potential target match, after how many hours may we ask to delete the STR we filed?
    gold: [gotracs2024:chi:sec5:s5.4:sc:s3:svii]
    must_contain: ['36|thirty-six']
    kind: numeric
  - id: n005
