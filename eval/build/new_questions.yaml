    must_contain: ['deviation request']
    kind: factual
  - id: n013
    question: On what grounds may the AMLC Executive Director declare non-reporting days?
    gold: [gotracs2024:chi:sec6:s6.4]
    must_contain: ['emergency|calamity|quarantine', 'maintenance']
    kind: list
  - id: n014
    question: Do loan renewals or restructurings have to be reported as covered transactions?
    gold: [gotracs2024:chi:sec7:s7.1:sg, gotracs2024:chi:sec7:s7.4:se]
    must_contain: ['borrower|additional funds']
    kind: factual
  - id: n015
