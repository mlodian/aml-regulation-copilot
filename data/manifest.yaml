# Source documents for the corpus. Raw PDFs are downloaded locally and are
# NOT committed (see .gitignore); this manifest is the reproducible record.
#
# Versioning fields (Phase 2)
#   issued          date the issuance was approved or signed
#   effective_from  first day it applies; effective_basis says where the date comes from:
#                   "stated" (the text gives the date) or "issued" (the text says it takes
#                   effect on publication without printing the date, so the approval date
#                   stands in for it)
#   status          current | transitional | superseded | amendment
#                   transitional: repealed by a newer issuance that keeps it in force
#                   until the replacement is fully implemented
#   superseded_by   id of the issuance that replaces it; amends: ids it amends
#   index: false    amendment issuances whose text is already merged into a
#                   consolidated document; they date the changes but are not indexed
#   ocr: true       scanned PDF; text comes from ingest/ocr.py
#
# Not listed:
#   RA 11521 (2021 amendments to the AMLA): scanned, and its changes are consolidated
#     in the January 2021 IRR below.
#   RA 9160 as enacted in 2001: superseded wording (e.g. a PHP 4M covered-transaction
#     threshold, since lowered to PHP 500k); the IRR restates the law as amended.
#   IC circulars that only forward AMLC issuances already listed here.
documents:
