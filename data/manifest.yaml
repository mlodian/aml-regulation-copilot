    # provisions unchanged since the 2018 issue apply from then; amended ones are dated
    # by ingest/versions.py from ARI No. 1, s. 2020 and ARI No. 1, s. 2021
    effective_from: 2018-11-20
    effective_basis: issued
    status: current
    url: https://www.amlc.gov.ph/storage/v1/object/public/public-pdf/documents/c18a7493-143b-4fda-af6d-39bc7b99d488_2018_IRR_2021_JAN%20AMENDMENT.pdf
